<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>World Generator</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        --bg: #0b0f17;
        --panel: rgba(20, 27, 39, 0.82);
        --border: #2a3547;
        --text: #cfd8e3;
        --muted: #7f8da3;
        --accent: #5aa9ff;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; background: var(--bg); color: var(--text); font: 13px system-ui, sans-serif; overflow: hidden; }
      #globe { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }

      .panel { position: fixed; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
      .panel h2 { margin: 0 0 6px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
      label { display: grid; gap: 4px; }
      input, select, button { font: inherit; padding: 5px 8px; background: #0b0f17; color: inherit; border: 1px solid var(--border); border-radius: 6px; }
      button { cursor: pointer; }
      button:hover:not(:disabled) { border-color: var(--accent); }
      button:disabled { opacity: 0.45; cursor: default; }
      input[type="range"] { padding: 0; width: 100%; }
      input[type="checkbox"] { padding: 0; }
      .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
      .pair input { width: 100%; min-width: 0; }
      .row { display: flex; gap: 8px; align-items: center; }
      .check { display: flex; gap: 6px; align-items: center; }

      /* Left toolbar */
      #tools { top: 12px; left: 12px; padding: 8px; display: grid; gap: 4px; width: 118px; }
      #tools button { text-align: left; }
      #hint { color: var(--muted); font-size: 11px; line-height: 1.35; margin-top: 4px; }
      #tools button.active { background: var(--accent); color: #04101f; border-color: var(--accent); font-weight: 600; }

      /* Which moment of the simulation is drawn */
      #epoch { top: 12px; left: 50%; transform: translateX(-50%); padding: 6px 14px; font-size: 14px; font-variant-numeric: tabular-nums; pointer-events: none; }
      #epoch small { color: var(--muted); font-size: 11px; margin-left: 6px; }

      /* Right panel */
      #side { top: 0; right: 0; bottom: var(--timeline-height, 66px); width: var(--side-width, 220px); overflow-y: auto; padding: 8px; align-content: start; grid-auto-rows: max-content; border-width: 0 0 0 1px; border-radius: 0; display: grid; gap: 8px; background: var(--panel); }
      #side section { display: grid; gap: 8px; padding: 10px; background: rgba(34, 45, 62, 0.86); border-radius: 8px; }
      #side hr { width: 100%; margin: 2px 0; border: 0; border-top: 1px solid var(--border); }
      #side section, #side .sectionBody, #side label { grid-template-columns: minmax(0, 1fr); min-width: 0; }
      #side select, #side input { min-width: 0; max-width: 100%; }
      #side .sectionBody { display: grid; gap: 8px; }
      #side section.folded .sectionBody { display: none; }
      #side section.folded h2 { margin-bottom: 0; }
      #side h2[role="button"] { cursor: pointer; user-select: none; display: flex; align-items: center; gap: 6px; }
      #side h2[role="button"]::before { content: '\25BE'; font-size: 10px; transition: transform 0.12s; }
      #side section.folded h2[role="button"]::before { transform: rotate(-90deg); }
      #side h2[role="button"]:hover { color: var(--text, #e6edf7); }
      #sideGrip { position: fixed; top: 0; right: calc(var(--side-width, 220px) - 4px); width: 8px; z-index: 5; cursor: ew-resize; touch-action: none; border-radius: 4px; }
      #sideGrip:hover, #sideGrip:active { background: rgba(77, 163, 255, 0.35); }
      .hintline { color: var(--muted); font-size: 11px; }
      #sizeReadout { color: var(--muted); font-size: 11px; }
      #legend { display: grid; gap: 3px; font-size: 11px; color: var(--muted); }
      #legend .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
      #info, #pointerInfo { color: var(--muted); line-height: 1.4; }

      /* Bottom timeline */
      #timeline { left: 0; right: 0; bottom: 0; padding: 8px 12px; border-width: 1px 0 0 0; border-radius: 0; display: flex; gap: 12px; align-items: center; }
      #simulate { width: 84px; flex: none; }
      #scrubWrap { flex: 1; position: relative; padding-bottom: 10px; }
      #scrubWrap input[type="range"] { width: 100%; margin: 0; }
      #runBar { position: absolute; left: 8px; right: 8px; bottom: 0; height: 8px; border-radius: 2px; background: rgba(150, 170, 200, 0.12); pointer-events: none; overflow: hidden; visibility: hidden; }
      #runBar i { display: block; height: 100%; width: 0; background: rgba(77, 163, 255, 0.4); }
      #ticks { position: absolute; left: 0; right: 0; bottom: 0; height: 8px; pointer-events: none; }
      #ticks i { position: absolute; bottom: 0; width: 2px; height: 5px; margin-left: -1px; background: var(--muted); opacity: 0.35; border-radius: 1px; }
      #ticks i.done { height: 8px; background: var(--accent, #4da3ff); opacity: 1; }
      #timeReadout { height: 16px; line-height: 16px; margin-bottom: 2px; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); font-variant-numeric: tabular-nums; }

      @media (max-width: 760px) {
        :root { --side-width: 180px; }
      }
    </style>
  </head>
  <body>
    <canvas id="globe"></canvas>
    <div id="epoch" class="panel" aria-live="polite"></div>

    <div id="tools" class="panel">
      <h2>Tools</h2>
      <button data-tool="orbit" class="active">Orbit</button>
      <button data-tool="land">Paint land</button>
      <button data-tool="ocean">Paint ocean</button>
      <button data-tool="raise">Raise</button>
      <button data-tool="lower">Lower</button>
      <button data-tool="addPlate">Add plate</button>
      <button data-tool="removePlate">Remove plate</button>
      <button data-tool="splitPlate">Split plate</button>
      <button data-tool="dragPlate">Drag plate</button>
      <button data-tool="paintPlate">Paint plate</button>
      <button id="undo">Undo</button>
      <div id="hint">Drag to turn the globe, scroll to zoom.</div>
    </div>

    <div id="side" class="panel">
      <section>
        <h2>World</h2>
        <label>Seed <input id="seed" value="first-world" /></label>
        <label>Simulation detail <span class="hintline">sets how finely the world is simulated</span>
          <select id="detail">
            <option value="draft">Draft (~10k points)</option>
            <option value="default" selected>Default (~40k points)</option>
            <option value="detailed">Detailed (~160k points)</option>
            <option value="fine">Fine (~320k points, slow)</option>
            <option value="ultra">Ultra (~580k points, very slow)</option>
          </select>
        </label>
        <label>Render detail <span class="hintline">sets how finely it is drawn</span>
          <select id="renderDetail">
            <option value="match" selected>Match simulation</option>
            <option value="draft">Low (~10k cells)</option>
            <option value="default">Medium (~40k cells)</option>
            <option value="detailed">High (~160k cells)</option>
            <option value="fine">Very high (~320k cells)</option>
            <option value="ultra">Ultra (~580k cells, heavy)</option>
          </select>
        </label>
        <label>Keyframe spacing <span class="hintline">how often a run is saved to the timeline; wider spacing runs faster</span>
          <select id="keyframe">
            <option value="5">Every 5 My</option>
            <option value="10" selected>Every 10 My</option>
            <option value="15">Every 15 My</option>
            <option value="20">Every 20 My</option>
          </select>
        </label>
        <button id="regen">New world</button>
        <hr />
        <label>Land style
          <select id="landStyle">
            <option value="continents" selected>Continents</option>
            <option value="pangaea">Pangaea</option>
            <option value="two">Two supercontinents</option>
            <option value="archipelago">Archipelago</option>
          </select>
        </label>
        <label>Land cover <span id="coverReadout">30%</span>
          <input id="landCover" type="range" min="5" max="60" step="1" value="30" />
        </label>
        <button id="generate">Generate land</button>
        <hr />
        <label>Axial tilt <span id="tiltReadout">23°</span>
          <input id="tilt" type="range" min="0" max="45" step="1" value="23" />
        </label>
        <label>Spin
          <select id="spin">
            <option value="1" selected>Like Earth</option>
            <option value="-1">Reversed</option>
          </select>
        </label>
        <label>Sea level <span id="seaReadout">0 m</span>
          <input id="seaLevel" type="range" min="-1000" max="2000" step="50" value="0" />
        </label>
        <button id="recompute">Recompute climate</button>
      </section>
      <section>
        <h2>Brush</h2>
        <label>Size <span id="sizeReadout"></span> <input id="radius" type="range" min="0.03" max="0.6" step="0.01" value="0.2" /></label>
        <label>Strength <input id="strength" type="range" min="0.05" max="1" step="0.05" value="0.4" /></label>
        <label>When removing a plate
          <select id="removeMode">
            <option value="reset" selected>Reset its ground to seafloor</option>
            <option value="keep">Keep its crust</option>
          </select>
        </label>
      </section>
      <section>
        <h2>View</h2>
        <label>Layer
          <select id="layer">
            <option value="elevation" selected>Elevation</option>
            <option value="plates">Plates</option>
            <option value="temperature">Temperature</option>
            <option value="rainfall">Rainfall</option>
            <option value="biomes">Biomes</option>
            <option value="geology">Geology</option>
          </select>
        </label>
        <div id="legend"></div>
        <label>Height exaggeration <span id="exagReadout">40×</span>
          <input id="exaggeration" type="range" min="1" max="100" step="1" value="40" />
        </label>
        <label class="check"><input id="edges" type="checkbox" /> Show cell edges</label>
        <label class="check"><input id="plateOutlines" type="checkbox" /> Plate outlines</label>
        <label class="check"><input id="water" type="checkbox" checked /> Rivers and lakes</label>
        <label class="check"><input id="winds" type="checkbox" /> Prevailing winds</label>
        <label>Rivers shown <input id="riverDensity" type="range" min="80" max="99.5" step="0.5" value="96" /></label>
        <label class="check"><input id="guideAxis" type="checkbox" /> Rotation axis</label>
        <label class="check"><input id="guideEquator" type="checkbox" /> Equator</label>
        <label class="check"><input id="guideTropics" type="checkbox" /> Tropics</label>
        <label class="check"><input id="guidePolar" type="checkbox" /> Polar circles</label>
      </section>
      <section>
        <h2>Save and export</h2>
        <label>Map projection
          <select id="projection"></select>
        </label>
        <label>Map centre <span id="centreReadout">0°N 0°E</span>
          <span class="pair">
            <input id="centreLat" type="number" min="-90" max="90" step="5" value="0" title="Latitude (globe view)" />
            <input id="centreLon" type="number" min="-180" max="180" step="5" value="0" title="Longitude" />
          </span>
        </label>
        <button id="centreFromView">Centre on current view</button>
        <label>Image width
          <select id="mapWidth">
            <option value="1024">1024 px</option>
            <option value="2048" selected>2048 px</option>
            <option value="4096">4096 px</option>
          </select>
        </label>
        <button id="exportPng">Export map (PNG)</button>
        <button id="saveWorld">Save world (JSON)</button>
        <button id="openWorld">Open world (JSON)</button>
        <input id="openFile" type="file" accept="application/json,.json" hidden />
      </section>
      <section>
        <h2>Info</h2>
        <div id="info"></div>
        <div id="pointerInfo">Hover the globe for latitude and height.</div>
      </section>
    </div>

    <div id="timeline" class="panel">
      <button id="simulate">Simulate</button>
      <div id="scrubWrap">
        <div id="timeReadout">t = 0 My</div>
        <input id="scrub" type="range" min="0" max="200" step="10" value="0" disabled />
        <div id="runBar"><i></i></div>
        <div id="ticks"></div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
